<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Magma · 석희쌤의 과학 시뮬레이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="./theme.css?v=1">
<style>
  :root{ --mono:'JetBrains Mono',ui-monospace,monospace; }
  body{background-image:none}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px}

  /* ── 상단: 화산 단면 띠 ── */
  .crust{height:14px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 18px),linear-gradient(var(--magma),var(--lava));border-bottom:2px solid var(--ink)}

  /* ── 머리: 왼쪽 제목 / 오른쪽 교사 카드 ── */
  .head{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:end;padding:44px 0 34px;border-bottom:2px solid var(--ink)}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--magma);font-weight:700}
  .head h1{font-size:clamp(34px,7vw,64px);font-weight:900;line-height:1.05;letter-spacing:-.04em;margin:10px 0 16px}
  .head h1 em{font-style:normal;color:var(--magma)}
  .head p{color:var(--muted);font-size:15px;max-width:440px}

  .id{border:2px solid var(--ink);border-radius:4px;background:var(--card);position:relative}
  .id::before{content:'TEACHER';position:absolute;top:-11px;left:12px;background:var(--bg);padding:0 6px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em}
  .id .top{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px dashed var(--line)}
  .id .av{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--lava),var(--magma));border:2px solid var(--ink);display:grid;place-items:center;font-size:20px}
  .id .nm{font-weight:900;font-size:17px}
  .id .nm small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
  .id .motto{padding:10px 16px;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line)}
  .id ol{list-style:none;padding:10px 16px;font-size:13px;display:grid;gap:3px}
  .id ol li{display:grid;grid-template-columns:62px 1fr;gap:6px}
  .id ol li span{font-family:var(--mono);color:var(--magma);font-weight:700;font-size:12px;padding-top:1px}
  .id .links{display:flex;border-top:2px solid var(--ink)}
  .id .links a{flex:1;text-align:center;padding:9px 6px;font-size:13px;font-weight:800;color:var(--fg);text-decoration:none}
  .id .links a+a{border-left:2px solid var(--ink)}
  .id .links a:hover{background:var(--lava);color:#1f1a17}

  /* ── 과목 탭 ── */
  .tabs{display:flex;gap:22px;flex-wrap:wrap;margin:30px 0 8px;font-weight:800;font-size:15px}
  .tabs button{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;border-bottom:3px solid transparent}
  .tabs button.on{color:var(--fg);border-color:var(--magma)}

  /* ── 지층: 단원별 띠 ── */
  .layer{display:grid;grid-template-columns:150px 1fr;border-bottom:2px solid var(--ink)}
  .layer:first-of-type{border-top:2px solid var(--ink)}
  .lab{padding:18px 14px 18px 0;border-right:2px solid var(--ink);position:relative}
  .lab .c{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
  .lab .u{font-weight:900;font-size:16px;line-height:1.35;margin-top:4px}
  .lab::after{content:'';position:absolute;right:-2px;top:0;bottom:0;width:6px;background:var(--sc)}
  .rows{display:flex;flex-direction:column}
  a.row{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;padding:16px 4px 16px 18px;text-decoration:none;color:inherit;border-bottom:1px dashed var(--line)}
  a.row:last-child{border-bottom:0}
  a.row .n{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--magma)}
  a.row h3{font-size:17px;font-weight:800}
  a.row p{font-size:13.5px;color:var(--muted);margin-top:2px}
  a.row .t{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}
  a.row .go{font-size:20px;transition:transform .15s}
  a.row:hover{background:var(--card)}
  a.row:hover .go{transform:translateX(6px);color:var(--magma)}
  .empty{padding:40px 0;text-align:center;color:var(--muted);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}

  footer{margin:40px 0 32px;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

  @media (max-width:720px){
    .head{grid-template-columns:1fr;padding-top:30px}
    .layer{grid-template-columns:1fr}
    .lab{border-right:0;border-bottom:1px dashed var(--line);padding:14px 0 10px 14px}
    .lab::after{left:0;right:auto;width:5px}
    a.row{grid-template-columns:48px 1fr auto;padding-left:6px}
  }
</style>
</head>
<body>
<div class="crust"></div>
<div class="wrap">
  <header class="head">
    <div>
      <div class="kicker">🌋 EASY MAGMA · 수업용 인터랙티브</div>
      <h1>석희쌤의<br><em>움직이는</em> 과학</h1>
      <p>교과서 그림을 손으로 돌려 보고, 바꿔 보고, 확인해 보는 수업 자료입니다.<br>단원 순서대로 차곡차곡 쌓아 갑니다.</p>
    </div>
    <aside class="id">
      <div class="top"><div class="av">🌋</div><div class="nm">이석희<small>신림고등학교 지구과학 교사</small></div></div>
      <div class="motto">“어제보다 나으면 1년 후가 기대된다.”</div>
      <ol>
        <li><span>2021</span>서울대 지구과학교육과 졸업</li>
        <li><span>2022–</span>신림고 지구과학 교사</li>
        <li><span>2023–24</span>AIEDAP 리더·마스터교원, 교실혁명 선도교원</li>
        <li><span>2024–</span>강남구청 인강 통합과학 강사</li>
      </ol>
      <div class="links">
        <a href="mailto:magma4885@naver.com">메일 보내기 ✉</a>
      </div>
    </aside>
  </header>

  <nav class="tabs" id="subj">
    <button class="on" data-s="all">전체</button>
    <button data-s="earth">지구과학</button>
    <button data-s="integrated">통합과학</button>
    <button data-s="middle">중학교 과학</button>
    <button data-s="astro">천체 관측</button>
  </nav>
  <div id="list"></div>

  <footer><span>수업에 자유롭게 활용하세요</span></footer>
</div>

<script>
/* ===== 자료 목록: 새 자료는 여기에 추가 =====
   s: earth | integrated | middle | astro,  course: 과목명,  unit: 대단원 › 중단원 */
const ITEMS = [
  { s:'earth', course:'지구시스템과학', unit:'Ⅱ. 해수의 운동 › 05. 조석', no:'⓪',
    title:'기초 개념: 자전과 공전, 위도', desc:'지구의 자전과 달의 공전 → 위도와 적도 → 달이 다시 남중하기까지 + 확인 퀴즈',
    tags:['사전 학습','퀴즈'], href:'./tidal-force/basics/' },
  { s:'earth', course:'지구시스템과학', unit:'Ⅱ. 해수의 운동 › 05. 조석', no:'①~⑤',
    title:'기조력: 인력 + 원심력', desc:'달의 인력 → 원심력 → 합력(기조력) → 만조·간조·조차 → 하루 두 번의 조차가 다른 까닭',
    tags:['개념 탐구'], href:'./tidal-force/gravity/' },
  { s:'earth', course:'지구시스템과학', unit:'Ⅱ. 해수의 운동 › 05. 조석', no:'⑥',
    title:'위도별 조석 형태', desc:'관측자의 위도에 따라 반일주조·혼합조·일주조가 어떻게 나타나는지 3D 모형과 그래프로 확인',
    tags:['시뮬레이션'], href:'./tide/' },
  { s:'earth', course:'지구시스템과학', unit:'Ⅲ. 강수 과정과 대기의 운동 › 01. 지구 대기의 역할', no:'①',
    title:'복사와 대기의 선택적 흡수', desc:'온도에 따른 복사 곡선(태양 vs 지구) → 산소·오존, 이산화 탄소, 수증기의 흡수 띠를 켜고 끄며 선택적 흡수와 대기의 창 확인',
    tags:['시뮬레이션','기초 개념'], href:'./atmosphere/' },
  { s:'earth', course:'지구시스템과학', unit:'Ⅲ. 강수 과정과 대기의 운동 › 02. 지구 열수지', no:'⓪',
    title:'하늘의 색과 빛의 비밀', desc:'하늘은 왜 파랗고 노을은 왜 붉을까(산란, 화성의 푸른 노을) → 비너스의 벨트 → 신기루(굴절) → 무지개와 쌍무지개(굴절·반사)',
    tags:['동기 유발','시뮬레이션'], href:'./sky-optics/' },
  { s:'earth', course:'지구시스템과학', unit:'Ⅲ. 강수 과정과 대기의 운동 › 02. 지구 열수지', no:'①',
    title:'지구 열수지와 온실 효과', desc:'교과서 그림 Ⅲ-6의 에너지 흐름을 차례대로 따라가며 지구 전체·대기·지표의 열수지 확인 → 온실 기체·반사율을 바꾸며 에너지 불균형과 복사 평형 관찰',
    tags:['시뮬레이션'], href:'./heat-budget/' },
  { s:'earth', course:'지구시스템과학', unit:'Ⅲ. 강수 과정과 대기의 운동 › 02. 지구 열수지', no:'②',
    title:'생명 가능 지대와 지구 열수지', desc:'중심별까지 거리·반사율·온실 효과를 바꾸며 행성의 표면 온도와 물의 상태 확인 → 금성·지구·화성·대기 없는 지구 비교, 중심별 광도와 생명 가능 지대',
    tags:['시뮬레이션'], href:'./habitable-zone/' },
  { s:'earth', course:'지구시스템과학', unit:'Ⅲ. 강수 과정과 대기의 운동 › 03. 대기 안정도와 강수 과정', no:'①~④',
    title:'대기 안정도와 강수 과정', desc:'공기 덩어리를 올리며 단열 변화와 상승 응결 고도 확인 → 기온 감률을 바꾸며 공기 덩어리를 밀어 올려 안정·불안정 판정 → 단열선도 탐구(A·B 지점, 굴뚝 연기) → 빙정설·병합설 애니메이션',
    tags:['시뮬레이션','탐구'], href:'./stability/' },
  { s:'earth', course:'지구시스템과학', unit:'Ⅲ. 강수 과정과 대기의 운동 › 04. 대기를 움직이는 힘', no:'①~④',
    title:'대기를 움직이는 힘', desc:'정역학 평형(중력 끄기 실험·ΔP 계산기) → 등압선 간격과 기압 경도력, 고기압·저기압의 연직 운동 → 회전원판 전향력 실험과 위도별 전향력 → 지표면에 따른 마찰력과 대기 경계층',
    tags:['시뮬레이션','탐구'], href:'./air-forces/' },
  { s:'earth', course:'지구시스템과학', unit:'Ⅲ. 강수 과정과 대기의 운동 › 05. 상층과 지상의 바람', no:'①~④',
    title:'상층과 지상의 바람', desc:'기압 경도력·전향력·구심력·마찰력의 평형으로 지균풍 형성 과정 → 저기압성·고기압성 경도풍 풍속 비교 → 지상풍(등압선과 이루는 각, 저기압 수렴·고기압 발산) → 높이에 따른 바람(에크만 나선)',
    tags:['시뮬레이션'], href:'./wind/' },
  { s:'earth', course:'지구시스템과학', unit:'Ⅲ. 강수 과정과 대기의 운동 › 06. 행성파', no:'①',
    title:'행성파: 편서풍 파동', desc:'북극에서 내려다본 편서풍 파동의 변동(가→라) → 기압골 서쪽 수렴·동쪽 발산과 지상 고기압·저기압 → 인천↔LA 비행시간 차이와 제트류',
    tags:['시뮬레이션'], href:'./planetary-wave/' },
  { s:'integrated', course:'통합과학2', unit:'Ⅱ. 환경과 에너지 › 지구 환경의 변화', no:'①',
    title:'엘니뇨 실험실', desc:'El Clásico로 여는 엘니뇨 어원 → 기초 개념(위도·경도와 세계 지도, 무역풍, 층상 구조) → 무역풍 세기를 바꾸는 태평양 3D 블록 모형 → 세계 영향과 확인 문제',
    tags:['시뮬레이션','1학기 복습','퀴즈'], href:'./elnino/' },
  { s:'astro', course:'천체 관측', unit:'2026 추계 학생 천체관측회 › 11. 6.(금) 융합과학교육원', no:'⓪',
    title:'기초 개념: 방위 · 일주 운동 · 연주 운동 · 적경·적위', desc:'동서남북·방위각·고도와 별 찾기 게임 → 태양의 일주 운동 3D(우주에서 본 지구 ↔ 서울 관측자) → 태양의 연주 운동 3D(태양계 밖 ↔ 지구에서 본 천구) → 천구와 적경·적위, 남중 고도·주극성 → 확인 퀴즈',
    tags:['사전 학습','시뮬레이션','퀴즈'], href:'./observing/basics/' },
  { s:'astro', course:'천체 관측', unit:'2026 추계 학생 천체관측회 › 11. 6.(금) 융합과학교육원', no:'①~④',
    title:'천체관측회 하늘 미리보기', desc:'관측 당일 시각별 하늘(도심·시골 하늘 밝기 비교) → 대상별 고도 시간표와 관측 순서 → 망원경 배율·실시야와 접안렌즈 화면 시뮬레이터, 조립 순서 게임 → 관측 미션 도장판',
    tags:['시뮬레이션','사전교육','게임'], href:'./observing/' },
  { s:'middle', course:'중학교 과학', unit:'기초 개념 › 위도와 경도', no:'①',
    title:'위도와 경도', desc:'3D 지구본에서 지구 중심 각으로 위도·경도 보기 → 세계 지도에서 끌어서 읽기 → 좌표로 도시 찾기 게임',
    tags:['시뮬레이션','게임'], href:'./latlon/' },
];
const SUBJ = { earth:{ name:'지구과학', color:'var(--magma)' }, integrated:{ name:'통합과학', color:'var(--teal)' }, middle:{ name:'중학교 과학', color:'var(--violet)' }, astro:{ name:'천체 관측', color:'var(--lava)' } };
let cur = 'all';
const $ = id => document.getElementById(id);

function render(){
  const list = ITEMS.filter(it => cur === 'all' || it.s === cur);
  if (!list.length){ $('list').innerHTML = `<div class="empty">${SUBJ[cur].name} 자료는 준비 중입니다.</div>`; return; }
  const groups = new Map();
  list.forEach(it => { const k = it.course + '|' + it.unit; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); });
  $('list').innerHTML = [...groups].map(([k, its]) => {
    const [main, sub] = its[0].unit.split(' › ');
    return `<section class="layer" style="--sc:${SUBJ[its[0].s].color}">
      <div class="lab"><div class="c">${its[0].course}</div><div class="u">${sub || main}</div><div class="c" style="margin-top:4px">${sub ? main : ''}</div></div>
      <div class="rows">${its.map(it => `<a class="row" href="${it.href}">
        <span class="n">${it.no}</span>
        <div><h3>${it.title}</h3><p>${it.desc}</p><div class="t">${it.tags.map(t => '#' + t).join('  ')}</div></div>
        <span class="go">→</span></a>`).join('')}</div>
    </section>`;
  }).join('');
}
document.querySelectorAll('#subj button').forEach(b => b.addEventListener('click', () => {
  cur = b.dataset.s;
  document.querySelectorAll('#subj button').forEach(x => x.classList.toggle('on', x === b));
  history.replaceState(null, '', cur === 'all' ? location.pathname : '#s=' + cur);
  render();
}));
// 주소로 바로 열기: #s=earth (예전 주소 #earth 도 지원)
const h = new URLSearchParams(location.hash.slice(1)).get('s') || location.hash.slice(1);
if (SUBJ[h]){ cur = h; document.querySelectorAll('#subj button').forEach(x => x.classList.toggle('on', x.dataset.s === h)); }
render();
</script>
</body>
</html>
