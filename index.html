<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Magma · 과학 수업 시뮬레이터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --fg:#1f1b16; --muted:#6b6259; --card:#ffffff; --line:#e7dfd4;
    --accent:#d9480f; --accent-soft:#fff1e6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16130f; --fg:#f2ece4; --muted:#a39889; --card:#211c17; --line:#3a322a;
           --accent:#ff7a3d; --accent-soft:#2c1d14; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--fg);
       line-height:1.6;padding:48px 16px 64px}
  .wrap{max-width:860px;margin:0 auto}
  header{margin-bottom:36px}
  .logo{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
  h1{font-size:clamp(28px,6vw,40px);font-weight:700;margin:6px 0 8px;line-height:1.25}
  .sub{color:var(--muted)}
  h2{font-size:15px;font-weight:700;color:var(--muted);margin:32px 0 12px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:18px 18px 16px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
  a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .tag{display:inline-block;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);
       padding:2px 8px;border-radius:999px;margin-bottom:8px}
  .card h3{font-size:17px;font-weight:700;margin-bottom:4px}
  .card p{font-size:14px;color:var(--muted)}
  .empty{border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:14px}
  footer{margin-top:48px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🌋 Easy Magma</div>
    <h1>과학 수업 시뮬레이터</h1>
    <p class="sub">수업 시간에 바로 열어 보는 인터랙티브 자료 모음</p>
  </header>

  <!-- 새 시뮬레이터를 추가할 때 아래 카드 형식을 복사해 쓰세요 -->
  <h2>지구과학</h2>
  <div class="grid">
    <a class="card" href="./tidal-force/basics/">
      <span class="tag">해양 · 0</span>
      <h3>기초 개념: 위도, 자전과 공전</h3>
      <p>적도·저위도·중위도·고위도, 자전과 공전 + 확인 퀴즈</p>
    </a>
    <a class="card" href="./tidal-force/gravity/">
      <span class="tag">해양 · 1</span>
      <h3>기조력: 인력 + 원심력</h3>
      <p>① 달의 인력 → ② 원심력 → ③ 합력(기조력) → ④ 조차가 다른 까닭</p>
    </a>
    <a class="card" href="./tide/">
      <span class="tag">해양 · 2</span>
      <h3>위도별 조석 형태</h3>
      <p>위도와 달 적위에 따른 반일주조·혼합조·일주조</p>
    </a>
    <!-- 새 카드 형식:
    <a class="card" href="./폴더명/">
      <span class="tag">분류</span>
      <h3>제목</h3>
      <p>설명</p>
    </a>
    -->
  </div>

  <h2>통합과학</h2>
  <div class="grid">
    <div class="empty">준비 중</div>
  </div>

  <footer>easy-magma.github.io</footer>
</div>
</body>
</html>
